services:
  kms:
    image: ywsj/ywsj-kms:latest
    container_name: ywsj-kms
    restart: always
    ports:
      - "1688:1688"     # KMS服务端口
      - "8080:8080"     # Web监控面板端口
    volumes:
      - ./data:/data    # 数据持久化(激活日志数据库)
    environment:
      - TZ=Asia/Shanghai
      - ADMIN_USER=admin       # Web面板用户名
      - ADMIN_PASS=kms123456   # Web面板密码(首次启动后建议修改)
